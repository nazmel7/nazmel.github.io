<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nazmel — Coming Soon</title>

  <!-- Security Hardening: Anti-MIME sniffing & Referrer Isolation -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- 
    CSP Meta Tag: 
    - Loads fonts strictly from Google's verified endpoints
    - Authorizes only the exact inline script below using its SHA-256 integrity hash
    - Blocks any external, injected, or altered scripts from executing
  -->
  <meta 
    http-equiv="Content-Security-Policy" 
    content="default-src 'self'; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'sha256-4+dG+m+rZ+vY9rGhy2zP4s8xR/d9s3EHQ8Fm519pYvM='; img-src 'self' data:;" 
  />

  <!-- Fonts: Signature cursive + Modern clean UI font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #090c0a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --border-card: rgba(114, 242, 179, 0.15);
      --accent: #72f2b3;
      --accent-glow: rgba(114, 242, 179, 0.35);
      --text-main: #f0fdf4;
      --text-muted: #8e9c93;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background lights */
    .ambient-glow {
      position: fixed;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(114, 242, 179, 0.12) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { top: -100px; left: 50%; transform: translateX(-50%); }
    .glow-2 { bottom: -150px; right: -50px; }

    /* Splash Screen Overlay */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .signature-svg {
      width: min(85vw, 600px);
      height: 250px;
      overflow: visible;
    }

    .signature-text {
      font-family: 'Alex Brush', cursive;
      font-size: 130px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(114, 242, 179, 0.9))
              drop-shadow(0 0 25px var(--accent-glow));
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Status Pill */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: rgba(114, 242, 179, 0.08);
      border: 1px solid var(--border-card);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    /* Typography */
    .brand-mark {
      font-family: 'Alex Brush', cursive;
      font-size: clamp(3rem, 7vw, 4.2rem);
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 0 16px var(--accent-glow);
    }

    .headline {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    /* Countdown Grid */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 480px;
      margin-top: 1.5rem;
      margin-bottom: 3rem;
    }

    .time-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(12px);
      padding: 1rem 0.5rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-val {
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.35rem;
      font-variant-numeric: tabular-nums;
    }

    .time-unit {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    @media (max-width: 520px) {
      .countdown-grid {
        gap: 0.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <svg class="signature-svg" viewBox="0 0 600 250">
      <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" class="signature-text">
        Nazmel
      </text>
    </svg>
  </div>

  <!-- Coming Soon Hero Content -->
  <main class="container" id="main-content">
    <div class="badge">
      <span class="badge-dot"></span>
      Coming Soon
    </div>

    <div class="brand-mark">Nazmel</div>
    <h1 class="headline">Crafting Something Unique.</h1>

    <!-- Countdown Timer -->
    <div class="countdown-grid">
      <div class="time-card">
        <span class="time-val" id="days">--</span>
        <span class="time-unit">Days</span>
      </div>
      <div class="time-card">
        <span class="time-val" id="hours">--</span>
        <span class="time-unit">Hours</span>
      </div>
      <div class="time-card">
        <span class="time-val" id="minutes">--</span>
        <span class="time-unit">Mins</span>
      </div>
      <div class="time-card">
        <span class="time-val" id="seconds">--</span>
        <span class="time-unit">Secs</span>
      </div>
    </div>
  </main>

  <!-- Note: If you edit the JS below, you can replace the CSP sha256 with 'unsafe-inline' if you prefer rapid local editing -->
  <script>
    'use strict';

    document.addEventListener('DOMContentLoaded', () => {
      const textElement = document.querySelector('.signature-text');
      const splash = document.getElementById('splash-screen');
      const mainContent = document.getElementById('main-content');

      if (textElement && splash && mainContent) {
        document.fonts.ready.then(() => {
          const length = textElement.getComputedTextLength() * 3.5;
          textElement.style.strokeDasharray = length;
          textElement.style.strokeDashoffset = length;

          setTimeout(() => {
            splash.classList.add('hidden');
            mainContent.classList.add('visible');
          }, 2800);
        });
      }

      // Target Date: October 1, 2026
      const targetDate = new Date('2026-10-01T00:00:00').getTime();

      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');

      function updateCountdown() {
        const now = Date.now();
        const diff = targetDate - now;

        if (diff <= 0) {
          if (daysEl) daysEl.textContent = '00';
          if (hoursEl) hoursEl.textContent = '00';
          if (minutesEl) minutesEl.textContent = '00';
          if (secondsEl) secondsEl.textContent = '00';
          return;
        }

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        if (daysEl) daysEl.textContent = String(d).padStart(2, '0');
        if (hoursEl) hoursEl.textContent = String(h).padStart(2, '0');
        if (minutesEl) minutesEl.textContent = String(m).padStart(2, '0');
        if (secondsEl) secondsEl.textContent = String(s).padStart(2, '0');
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    });
  </script>
</body>
</html>
