<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nazmel</title>
  <!-- Beautiful signature cursive font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0c100e;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #090c0a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .signature-svg {
      width: min(85vw, 600px);
      height: 250px;
      overflow: visible;
    }

    .signature-text {
      font-family: 'Alex Brush', cursive;
      font-size: 130px;
      fill: none;
      stroke: #72f2b3;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(114, 242, 179, 0.9))
              drop-shadow(0 0 25px rgba(114, 242, 179, 0.45));
      
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 1rem;
    }

    .content h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #72f2b3;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <svg class="signature-svg" viewBox="0 0 600 250">
      <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" class="signature-text">
       Nazmel 
      </text>
    </svg>
  </div>


  <script>
    const textElement = document.querySelector('.signature-text');
    const splash = document.getElementById('splash-screen');

    // Wait until Google font loads before computing length and timing fade
    document.fonts.ready.then(() => {
      const length = textElement.getComputedTextLength() * 3.5;
      textElement.style.strokeDasharray = length;
      textElement.style.strokeDashoffset = length;

      setTimeout(() => {
        splash.classList.add('hidden');
      }, 2800);
    });
  </script>
</body>
</html>
