<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nazmel</title>



  <!-- Fonts: Signature cursive + Modern clean UI font -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">



  <style>

    :root {

      --bg-dark: #090c0a;

      --bg-card: rgba(255, 255, 255, 0.03);

      --border-card: rgba(114, 242, 179, 0.15);

      --accent: #72f2b3;

      --accent-glow: rgba(114, 242, 179, 0.35);

      --text-main: #f0fdf4;

      --text-muted: #8e9c93;

    }



    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }



    body {

      background-color: var(--bg-dark);

      color: var(--text-main);

      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

      min-height: 100vh;

      overflow-x: hidden;

      position: relative;

    }



    /* Instant display rules when splash screen has already been seen */

    body.no-splash #splash-screen {

      display: none !important;

    }



    body.no-splash .container {

      opacity: 1 !important;

      transform: none !important;

      transition: none !important;

    }



    /* Ambient background lights */

    .ambient-glow {

      position: fixed;

      width: 480px;

      height: 480px;

      border-radius: 50%;

      background: radial-gradient(circle, rgba(114, 242, 179, 0.12) 0%, transparent 70%);

      filter: blur(80px);

      pointer-events: none;

      z-index: 0;

    }

    .glow-1 { top: -100px; left: 50%; transform: translateX(-50%); }

    .glow-2 { bottom: -150px; right: -50px; }



    /* Splash Screen Overlay */

    #splash-screen {

      position: fixed;

      inset: 0;

      background-color: var(--bg-dark);

      display: flex;

      justify-content: center;

      align-items: center;

      z-index: 9999;

      transition: opacity 0.8s ease, visibility 0.8s ease;

    }



    #splash-screen.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }



    .signature-svg {

      width: min(85vw, 600px);

      height: 250px;

      overflow: visible;

    }



    .signature-text {

      font-family: 'Alex Brush', cursive;

      font-size: 130px;

      fill: none;

      stroke: var(--accent);

      stroke-width: 2.2;

      stroke-linecap: round;

      stroke-linejoin: round;

      filter: drop-shadow(0 0 10px rgba(114, 242, 179, 0.9))

              drop-shadow(0 0 25px var(--accent-glow));

      stroke-dasharray: 1200;

      stroke-dashoffset: 1200;

    }



    .signature-text.animate {

      animation: draw 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;

    }



    @keyframes draw {

      to {

        stroke-dashoffset: 0;

      }

    }



    /* Main Container */

    .container {

      position: relative;

      z-index: 1;

      max-width: 860px;

      min-height: 100vh;

      margin: 0 auto;

      padding: 3rem 1.5rem;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      opacity: 0;

      transform: translateY(20px);

      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);

    }



    .container.visible {

      opacity: 1;

      transform: translateY(0);

    }



    /* Status Pill */

    .badge {

      display: inline-flex;

      align-items: center;

      gap: 0.55rem;

      padding: 0.4rem 1rem;

      border-radius: 9999px;

      background: rgba(114, 242, 179, 0.08);

      border: 1px solid var(--border-card);

      font-size: 0.85rem;

      font-weight: 500;

      color: var(--accent);

      margin-bottom: 2rem;

      letter-spacing: 0.04em;

      text-transform: uppercase;

    }



    .badge-dot {

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background-color: var(--accent);

      box-shadow: 0 0 8px var(--accent);

      animation: pulse 2s infinite ease-in-out;

    }



    @keyframes pulse {

      0%, 100% { transform: scale(1); opacity: 1; }

      50% { transform: scale(1.3); opacity: 0.5; }

    }



    /* Typography */

    .brand-mark {

      font-family: 'Alex Brush', cursive;

      font-size: clamp(3rem, 7vw, 4.2rem);

      color: var(--accent);

      line-height: 1;

      margin-bottom: 0.75rem;

      text-shadow: 0 0 16px var(--accent-glow);

    }



    .headline {

      font-size: clamp(2rem, 5vw, 3.4rem);

      font-weight: 700;

      letter-spacing: -0.03em;

      line-height: 1.15;

      margin-bottom: 0.75rem;

      color: #ffffff;

    }



    .description {

      font-size: clamp(1rem, 2.5vw, 1.15rem);

      color: var(--text-muted);

      max-width: 540px;

      margin-bottom: 2.75rem;

      line-height: 1.6;

      font-weight: 400;

    }



    /* Countdown Grid */

    .countdown-grid {

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 1rem;

      width: 100%;

      max-width: 480px;

      margin-bottom: 2.5rem;

    }



    .time-card {

      background: var(--bg-card);

      border: 1px solid var(--border-card);

      backdrop-filter: blur(12px);

      padding: 1rem 0.5rem;

      border-radius: 12px;

      display: flex;

      flex-direction: column;

      align-items: center;

    }



    .time-val {

      font-size: clamp(1.5rem, 3.5vw, 2.2rem);

      font-weight: 700;

      color: var(--accent);

      line-height: 1;

      margin-bottom: 0.35rem;

      font-variant-numeric: tabular-nums;

    }



    .time-unit {

      font-size: 0.72rem;

      text-transform: uppercase;

      letter-spacing: 0.08em;

      color: var(--text-muted);

      font-weight: 600;

    }



    /* Notification Form */

    .notify-form {

      width: 100%;

      max-width: 460px;

      display: flex;

      gap: 0.6rem;

      margin-bottom: 2.5rem;

    }



    .notify-input {

      flex: 1;

      background: rgba(255, 255, 255, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 8px;

      padding: 0.85rem 1.1rem;

      color: #fff;

      font-family: inherit;

      font-size: 0.95rem;

      outline: none;

      transition: border-color 0.2s ease, box-shadow 0.2s ease;

    }



    .notify-input:focus {

      border-color: var(--accent);

      box-shadow: 0 0 10px rgba(114, 242, 179, 0.25);

    }



    .notify-input::placeholder {

      color: rgba(255, 255, 255, 0.35);

    }



    .notify-btn {

      background: var(--accent);

      color: #090c0a;

      border: none;

      padding: 0.85rem 1.4rem;

      border-radius: 8px;

      font-family: inherit;

      font-weight: 600;

      font-size: 0.95rem;

      cursor: pointer;

      transition: transform 0.15s ease, filter 0.2s ease;

      white-space: nowrap;

    }



    .notify-btn:hover {

      filter: brightness(1.1);

      transform: translateY(-1px);

    }



    .notify-btn:active {

      transform: translateY(0);

    }



    /* Social Links */

    .social-links {

      display: flex;

      gap: 1.5rem;

      align-items: center;

    }



    .social-links a {

      color: var(--text-muted);

      text-decoration: none;

      font-size: 0.88rem;

      font-weight: 500;

      transition: color 0.2s ease;

    }



    .social-links a:hover {

      color: var(--accent);

    }



    @media (max-width: 520px) {

      .notify-form {

        flex-direction: column;

      }

      .countdown-grid {

        gap: 0.6rem;

      }

    }

  </style>

</head>

<body>



  <!-- Ambient Glow -->

  <div class="ambient-glow glow-1"></div>

  <div class="ambient-glow glow-2"></div>



  <!-- Splash Screen -->

  <div id="splash-screen">

    <svg class="signature-svg" viewBox="0 0 600 250">

      <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" class="signature-text">

        Nazmel

      </text>

    </svg>

  </div>



  <!-- Coming Soon Hero Content -->

  <main class="container" id="main-content">

    <div class="badge">

      <span class="badge-dot"></span>

      Coming Soon

    </div>



    <div class="brand-mark">Nazmel</div>

    <h1 class="headline">Crafting Something Unique.</h1>

    <br>



    <!-- Countdown Timer -->

    <div class="countdown-grid">

      <div class="time-card">

        <span class="time-val" id="days">00</span>

        <span class="time-unit">Days</span>

      </div>

      <div class="time-card">

        <span class="time-val" id="hours">00</span>

        <span class="time-unit">Hours</span>

      </div>

      <div class="time-card">

        <span class="time-val" id="minutes">00</span>

        <span class="time-unit">Mins</span>

      </div>

      <div class="time-card">

        <span class="time-val" id="seconds">00</span>

        <span class="time-unit">Secs</span>

      </div>

    </div>

  </main>



  <script>

    const textElement = document.querySelector('.signature-text');

    const splash = document.getElementById('splash-screen');

    const mainContent = document.getElementById('main-content');



    // Check if the user has already seen the splash screen in this session

    const hasSeenSplash = sessionStorage.getItem('nazmel_splash_seen');



    if (hasSeenSplash) {

      // Skip the splash screen immediately on refresh

      document.body.classList.add('no-splash');

    } else {

      // First visit: run signature animation

      document.fonts.ready.then(() => {

        const length = textElement.getComputedTextLength() * 3.5;

        textElement.style.strokeDasharray = length;

        textElement.style.strokeDashoffset = length;

        textElement.classList.add('animate');



        setTimeout(() => {

          splash.classList.add('hidden');

          mainContent.classList.add('visible');

          sessionStorage.setItem('nazmel_splash_seen', 'true');

        }, 2800);

      });

    }



    // Countdown target

    const targetDate = new Date("2026-10-01T00:00:00").getTime();



    function updateCountdown() {

      const now = Date.now();

      const diff = targetDate - now;



      if (diff <= 0) {

        document.getElementById('days').textContent = '00';

        document.getElementById('hours').textContent = '00';

        document.getElementById('minutes').textContent = '00';

        document.getElementById('seconds').textContent = '00';

        return;

      }



      const d = Math.floor(diff / (1000 * 60 * 60 * 24));

      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

      const s = Math.floor((diff % (1000 * 60)) / 1000);



      document.getElementById('days').textContent = String(d).padStart(2, '0');

      document.getElementById('hours').textContent = String(h).padStart(2, '0');

      document.getElementById('minutes').textContent = String(m).padStart(2, '0');

      document.getElementById('seconds').textContent = String(s).padStart(2, '0');

    }



    updateCountdown();

    setInterval(updateCountdown, 1000);

  </script>

</body>

</html>
