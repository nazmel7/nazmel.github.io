<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nazmel — Portfolio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg-dark: #090d0b;
      --bg-soft: #0d1310;

      --accent: #72f2b3;
      --accent-soft: rgba(114, 242, 179, 0.08);
      --accent-border: rgba(114, 242, 179, 0.16);

      --text-main: #f2f5f3;
      --text-muted: #8c9891;
      --text-faint: #536059;

      --card-bg: rgba(255, 255, 255, 0.025);
      --card-border: rgba(255, 255, 255, 0.08);
    }


    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
      background: var(--bg-dark);
    }


    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(114, 242, 179, 0.055),
          transparent 32%
        ),
        var(--bg-dark);

      color: var(--text-main);

      font-family:
        'Plus Jakarta Sans',
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      overflow-x: hidden;
    }


    /* =========================
       SPLASH SCREEN
    ========================= */

    body.no-splash #splash-screen {
      display: none !important;
    }

    body.no-splash .container {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }


    #splash-screen {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--bg-dark);

      z-index: 9999;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }


    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    .signature-svg {
      width: min(85vw, 600px);
      height: 250px;

      overflow: visible;
    }


    .signature-text {
      font-family: 'Alex Brush', cursive;

      font-size: 130px;

      fill: none;
      stroke: var(--accent);

      stroke-width: 2.2;

      stroke-linecap: round;
      stroke-linejoin: round;

      filter:
        drop-shadow(0 0 6px rgba(114, 242, 179, 0.45));

      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
    }


    .signature-text.animate {
      animation:
        draw 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }


    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
      position: relative;
      z-index: 1;

      width: min(100%, 900px);
      min-height: 100vh;

      margin: 0 auto;
      padding: 2rem 1.5rem;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      opacity: 0;
      transform: translateY(18px);

      transition:
        opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
        transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }


    .container.visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* =========================
       TOP META
    ========================= */

    .top-meta {
      position: absolute;

      top: 2rem;
      left: 1.5rem;
      right: 1.5rem;

      display: flex;
      justify-content: space-between;
      align-items: center;

      color: var(--text-faint);

      font-size: 0.68rem;
      font-weight: 500;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }


    .top-meta span:last-child {
      color: #68756e;
    }


    /* =========================
       STATUS
    ========================= */

    .badge {
      display: inline-flex;

      align-items: center;
      gap: 0.55rem;

      padding: 0.42rem 0.85rem;

      border-radius: 999px;

      background: rgba(114, 242, 179, 0.045);

      border: 1px solid var(--accent-border);

      color: var(--accent);

      font-size: 0.72rem;
      font-weight: 600;

      letter-spacing: 0.1em;
      text-transform: uppercase;

      margin-bottom: 1.8rem;
    }


    .badge-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--accent);

      animation:
        pulse 2.2s infinite ease-in-out;
    }


    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.9;
      }

      50% {
        transform: scale(1.25);
        opacity: 0.55;
      }
    }


    /* =========================
       BRAND
    ========================= */

    .brand-mark {
      font-family: 'Alex Brush', cursive;

      font-size: clamp(3.2rem, 8vw, 4.8rem);

      color: var(--accent);

      line-height: 1;

      margin-bottom: 1rem;

      text-shadow:
        0 0 12px rgba(114, 242, 179, 0.18);
    }


    /* =========================
       HEADLINE
    ========================= */

    .headline {
      max-width: 700px;

      color: #ffffff;

      font-size:
        clamp(2rem, 6vw, 3.7rem);

      font-weight: 700;

      letter-spacing: -0.045em;

      line-height: 1.08;

      margin-bottom: 1rem;
    }


    .headline .accent {
      color: var(--accent);
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      max-width: 480px;

      color: var(--text-muted);

      font-size:
        clamp(0.9rem, 2.4vw, 1.02rem);

      line-height: 1.7;

      font-weight: 400;

      margin-bottom: 2.7rem;
    }


    /* =========================
       COUNTDOWN
    ========================= */

    .countdown-wrapper {
      width: 100%;
      max-width: 500px;

      margin-bottom: 2rem;
    }


    .countdown-label {
      display: block;

      margin-bottom: 0.85rem;

      color: var(--text-faint);

      font-size: 0.65rem;
      font-weight: 600;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }


    .countdown-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 0.65rem;

      width: 100%;
    }


    .time-card {
      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      min-height: 92px;

      padding: 0.9rem 0.4rem;

      background: var(--card-bg);

      border: 1px solid var(--card-border);

      border-radius: 10px;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }


    .time-card:hover {
      background: rgba(114, 242, 179, 0.035);
      border-color: var(--accent-border);
    }


    .time-val {
      color: var(--accent);

      font-size:
        clamp(1.45rem, 4vw, 2rem);

      font-weight: 700;

      line-height: 1;

      margin-bottom: 0.45rem;

      font-variant-numeric:
        tabular-nums;
    }


    .time-unit {
      color: var(--text-faint);

      font-size: 0.62rem;

      font-weight: 600;

      letter-spacing: 0.1em;

      text-transform: uppercase;
    }


    /* =========================
       BOTTOM STATUS
    ========================= */

    .bottom-status {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 0.5rem;

      color: var(--text-faint);

      font-size: 0.68rem;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }


    .bottom-status .line {
      width: 22px;
      height: 1px;

      background: rgba(114, 242, 179, 0.2);
    }


    .bottom-status strong {
      color: #68756e;

      font-weight: 500;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      .container {
        padding:
          5rem 1.2rem 2rem;
      }


      .top-meta {
        top: 1.5rem;

        left: 1.2rem;
        right: 1.2rem;
      }


      .badge {
        margin-bottom: 1.5rem;
      }


      .brand-mark {
        font-size: 3.5rem;
      }


      .headline {
        font-size: clamp(2rem, 9vw, 2.7rem);

        letter-spacing: -0.04em;
      }


      .description {
        max-width: 330px;

        font-size: 0.9rem;

        margin-bottom: 2.2rem;
      }


      .countdown-grid {
        gap: 0.45rem;
      }


      .time-card {
        min-height: 82px;

        border-radius: 9px;
      }


      .time-val {
        font-size: 1.45rem;
      }


      .time-unit {
        font-size: 0.55rem;
      }


      .bottom-status {
        margin-top: 0.3rem;
      }
    }


    @media (max-width: 350px) {

      .countdown-grid {
        gap: 0.3rem;
      }


      .time-card {
        padding:
          0.7rem 0.2rem;
      }


      .time-val {
        font-size: 1.25rem;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       SPLASH SCREEN
  ========================== -->

  <div id="splash-screen">

    <svg
      class="signature-svg"
      viewBox="0 0 600 250"
      aria-label="Nazmel"
    >

      <text
        x="50%"
        y="60%"
        text-anchor="middle"
        dominant-baseline="middle"
        class="signature-text"
      >
        Nazmel
      </text>

    </svg>

  </div>


  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main
    class="container"
    id="main-content"
  >

    <!-- Small personal metadata -->

    <div class="top-meta">

      <span>NAZMEL.MY</span>

      <span>2026 / 01</span>

    </div>


    <!-- Status -->

    <div class="badge">

      <span class="badge-dot"></span>

      Portfolio in progress

    </div>


    <!-- Name -->

    <div class="brand-mark">
      Nazmel
    </div>


    <!-- Main message -->

    <h1 class="headline">

      Currently turning
      <span class="accent">ideas</span>
      into code.

    </h1>


    <!-- Personal description -->

    <p class="description">

      A Computer Science student building,
      experimenting and occasionally breaking
      things on the way.

    </p>


    <!-- Countdown -->

    <div class="countdown-wrapper">

      <span class="countdown-label">
        Portfolio launch
      </span>


      <div class="countdown-grid">

        <div class="time-card">

          <span
            class="time-val"
            id="days"
          >
            00
          </span>

          <span class="time-unit">
            Days
          </span>

        </div>


        <div class="time-card">

          <span
            class="time-val"
            id="hours"
          >
            00
          </span>

          <span class="time-unit">
            Hours
          </span>

        </div>


        <div class="time-card">

          <span
            class="time-val"
            id="minutes"
          >
            00
          </span>

          <span class="time-unit">
            Mins
          </span>

        </div>


        <div class="time-card">

          <span
            class="time-val"
            id="seconds"
          >
            00
          </span>

          <span class="time-unit">
            Secs
          </span>

        </div>

      </div>

    </div>


    <!-- Small developer-style status -->

    <div class="bottom-status">

      <span class="line"></span>

      <span>
        <strong>status:</strong>
        building
      </span>

      <span class="line"></span>

    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const textElement =
      document.querySelector('.signature-text');

    const splash =
      document.getElementById('splash-screen');

    const mainContent =
      document.getElementById('main-content');


    /*
      =========================
      SPLASH SCREEN
      =========================

      The splash only appears once
      per browser session.
    */

    const hasSeenSplash =
      sessionStorage.getItem('nazmel_splash_seen');


    if (hasSeenSplash) {

      // Skip splash immediately

      document.body.classList.add('no-splash');

    } else {

      // First visit

      document.fonts.ready.then(() => {

        const length =
          textElement.getComputedTextLength() * 3.5;


        textElement.style.strokeDasharray =
          length;

        textElement.style.strokeDashoffset =
          length;


        textElement.classList.add('animate');


        /*
          Wait for the signature animation
          before showing the website.
        */

        setTimeout(() => {

          splash.classList.add('hidden');

          mainContent.classList.add('visible');

          sessionStorage.setItem(
            'nazmel_splash_seen',
            'true'
          );

        }, 2800);

      });

    }


    /*
      =========================
      COUNTDOWN
      =========================

      Portfolio launch:
      1 October 2026
    */

    const targetDate =
      new Date(
        "2026-10-01T00:00:00"
      ).getTime();


    function updateCountdown() {

      const now = Date.now();

      const diff =
        targetDate - now;


      /*
        Countdown finished
      */

      if (diff <= 0) {

        document.getElementById('days')
          .textContent = '00';

        document.getElementById('hours')
          .textContent = '00';

        document.getElementById('minutes')
          .textContent = '00';

        document.getElementById('seconds')
          .textContent = '00';

        return;
      }


      /*
        Calculate time
      */

      const days =
        Math.floor(
          diff /
          (1000 * 60 * 60 * 24)
        );


      const hours =
        Math.floor(
          (diff %
            (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );


      const minutes =
        Math.floor(
          (diff %
            (1000 * 60 * 60)) /
          (1000 * 60)
        );


      const seconds =
        Math.floor(
          (diff %
            (1000 * 60)) /
          1000
        );


      /*
        Update UI
      */

      document.getElementById('days')
        .textContent =
        String(days).padStart(2, '0');


      document.getElementById('hours')
        .textContent =
        String(hours).padStart(2, '0');


      document.getElementById('minutes')
        .textContent =
        String(minutes).padStart(2, '0');


      document.getElementById('seconds')
        .textContent =
        String(seconds).padStart(2, '0');

    }


    /*
      Initial countdown
    */

    updateCountdown();


    /*
      Update every second
    */

    setInterval(
      updateCountdown,
      1000
    );

  </script>

</body>

</html>
